# El bucle largo, en automático: la capa "detectado" del carril.
# Corre en cada PR y en main. Si está en rojo, la PR no se mergea.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness:
    name: Bucle largo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Lee la versión de "packageManager" en package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke
        run: pnpm smoke
